# Web 版とカレンダーに必要なファイルだけを GitHub Pages に配信する。
# ブランチをそのまま配信すると docs/・ops/・プログラムまで Pages で開けてしまうため、下の PAGES_FILES だけを送る。
# 公式サイトにはアクセスしないので、GitHub のサーバーで動かす。
# 事前に Settings → Pages の Source を「GitHub Actions」にしておく。
name: Pages の配信

on:
  # 手元から ops/push_as_app.sh で push したとき
  push:
    branches: [main]
  # 定期の更新は GITHUB_TOKEN で push するので push では起動しない。更新のワークフローが終わったら配信する
  workflow_run:
    workflows: ["予定の更新"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 続けて起動されても、配信は 1 つずつ。古い配信は途中で止めない
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pages に置くファイル（Web 版・照会カレンダー・1 件ずつの .ics）
  PAGES_FILES: index.html schedule.md schedule.csv schedule.ics deadlines.md deadlines.csv deadlines.ics events

jobs:
  deploy:
    # 更新のワークフローが失敗した回は、コミットもしていないので配信しない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # workflow_run では起動時点ではなく、更新でコミットした後の main を配信する

      - name: 配信するファイルを集める
        run: |
          mkdir _site
          cp -r $PAGES_FILES _site/
          touch _site/.nojekyll
          find _site -maxdepth 1 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
