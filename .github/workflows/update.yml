# 予定を定期的に取り直し、変化があれば takaneko-fan 名義でコミットして push する。
# 公式サイトは国外からの REST API・管理画面へのアクセスを受け付けないため、
# GitHub のサーバーではなく ConoHa VPS（大阪）のセルフホストランナーで動かす。
name: 予定の更新

on:
  # VPS の systemd タイマーが日本時間 0:17 / 9:17 / 12:17 / 16:17 / 18:17 / 20:17 / 21:17 / 22:17 に GitHub App の名義で起動する（ops/dispatch_update.sh）。
  # GitHub の定時実行（schedule）は遅れたり抜けたりするうえ、起動者が cron 行を最後に変えた個人のアカウントとして
  # 公開されるため使わない
  workflow_dispatch:

permissions:
  contents: write

# 起動が重なっても、push がぶつからないよう 1 つずつ動かす
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, conoha]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: コミット名義を設定
        run: |
          git config user.name "takaneko-fan"
          git config user.email "bot@example.invalid"

      - name: 予定を取得してコミット・push
        env:
          # 未登録なら空になり、参加メモは memos.json の既存分だけを使う
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 未登録なら公式 X の確認を飛ばす
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # 未登録なら更新の通知を送らない
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 未登録なら今日の申込のリマインドを送らない
          NTFY_REMIND_TOPIC: ${{ secrets.NTFY_REMIND_TOPIC }}
        run: ./run_update.sh

      # 停止の検知（healthchecks.io）。VPS・ランナー・タイマーが止まって更新が動かないと連絡が途絶え、
      # healthchecks.io が知らせる。連絡に失敗しても更新は失敗にしない。未登録なら何もしない
      - name: 停止の検知に成功を知らせる
        if: success()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          [ -n "$HC_PING_URL" ] || exit 0
          curl -fsS --max-time 10 --retry 3 -o /dev/null "$HC_PING_URL" || echo "停止の検知への連絡に失敗しました"

      - name: 停止の検知に失敗を知らせる
        if: failure() || cancelled()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          [ -n "$HC_PING_URL" ] || exit 0
          curl -fsS --max-time 10 --retry 3 -o /dev/null "$HC_PING_URL/fail" || echo "停止の検知への連絡に失敗しました"

      # タイムアウトは cancelled になる。チェックアウトの失敗でも送れるよう notify.py を使わない
      # ntfy.sh の 1 日の上限を IPv6 の /64 で他の利用者と共有しないよう、IPv4 で送る
      - name: 失敗を通知
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          curl -4 -fsS --max-time 15 -o /dev/null https://ntfy.sh/ \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"高嶺のなでしこ 更新エラー\",\"message\":\"更新に失敗しました\",\"priority\":4,\"click\":\"$RUN_URL\"}"
